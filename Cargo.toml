[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "1.0.0"
publish = false
license = "GPL-3.0-or-later"

[workspace.dependencies]
wikirs-core = { path = "crates/wikirs-core" }
wikirs-ui = { path = "crates/wikirs-ui" }
wikirs-cli = { path = "crates/wikirs-cli" }
wikirs-mcp = { path = "crates/wikirs-mcp" }
wikirs-http = { path = "crates/wikirs-http" }
wikirs-tui = { path = "crates/wikirs-tui" }
wikirs-gui = { path = "crates/wikirs-gui" }
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
rmcp = { version = "3.5", features = ["server", "transport-io"] }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
# `preserve_order`: JSON keys and schema properties keep declaration order in
# every build (gpui turns it on anyway, and builds must agree).
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
insta = { version = "1.48", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
blake3 = "1.8"
dirs = "7"
rusqlite = { version = "0.40", features = ["bundled"] }
pulldown-cmark = { version = "0.13", default-features = false }
yaml-rust2 = "0.13"
percent-encoding = "2.3"
toml_edit = "0.25"
globset = "0.4"
base64 = "0.23"
notify-debouncer-full = "0.7"
axum = "0.8"
getrandom = "0.4"
tokio-stream = "0.1"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
similar = "2.7"
assert_cmd = "2.2"
proptest = "1"
# `line_count`: where an inline image lands once the Page is wrapped.
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
ratatui-textarea = "0.9"
# Inline images in terminals that can show them (kitty, iTerm2, sixel), else
# half-block characters. No chafa: it would need a C library.
ratatui-image = { version = "11.1", default-features = false, features = ["image-defaults", "crossterm"] }
image = "0.25"
# Pinned exactly: gpui and gpui-kit break weekly (workspace.md). An upgrade is
# one PR that moves both pins together.
gpui-kit = { version = "=0.7.0", features = ["tree-sitter-markdown", "tree-sitter-markdown-inline"] }
gpui = { package = "gpui-pre", version = "=0.3.7" }
# The completion types gpui-kit 0.7's editor speaks.
lsp-types = { version = "0.97", features = ["proposed"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"

[package]
name = "wikirs"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[features]
default = ["mcp", "http", "tui", "gui"]
mcp = ["dep:wikirs-mcp"]
http = ["mcp", "dep:wikirs-http"]
tui = ["dep:wikirs-tui"]
gui = ["dep:wikirs-gui"]
# Fault injection for tests (testing.md). Never enabled in release builds.
test-hooks = ["wikirs-core/test-hooks"]

[dependencies]
wikirs-core.workspace = true
wikirs-cli.workspace = true
wikirs-mcp = { workspace = true, optional = true }
wikirs-http = { workspace = true, optional = true }
wikirs-tui = { workspace = true, optional = true }
wikirs-gui = { workspace = true, optional = true }
clap.workspace = true
serde_json.workspace = true

[dev-dependencies]
serde_json.workspace = true
assert_cmd.workspace = true
tempfile.workspace = true
insta.workspace = true
rmcp = { workspace = true, features = ["client"] }
base64.workspace = true
tokio.workspace = true
wikirs-http.workspace = true
wikirs-tui.workspace = true
wikirs-ui.workspace = true
tower.workspace = true
http-body-util.workspace = true
axum.workspace = true

[lints]
workspace = true
